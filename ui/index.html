<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Governed & Auditable AI Content Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #09090b;
    --glass-bg: rgba(24, 24, 27, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
    --accent-hover: linear-gradient(135deg, #60a5fa, #a78bfa);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success-bg: rgba(16, 185, 129, 0.15);
    --success-text: #34d399;
    --error-bg: rgba(239, 68, 68, 0.15);
    --error-text: #f87171;
    --card-bg: rgba(255, 255, 255, 0.03);
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    padding: 40px 20px;
    line-height: 1.6;
    perspective: 1000px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  
  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 42px;
    margin: 0 0 12px;
    font-weight: 800;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.025em;
    filter: drop-shadow(0 2px 10px rgba(139, 92, 246, 0.3));
  }
  
  .sub {
    color: var(--text-muted);
    font-size: 16px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--glass-border);
  }
  
  .layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 32px;
  }
  
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--glass-shadow);
    margin-bottom: 24px;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
    transform-style: preserve-3d;
  }

  .glass-panel:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 15px 40px -5px rgba(59, 130, 246, 0.2);
  }
  
  .controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
    transform: translateZ(20px);
  }
  
  @media (max-width: 600px) {
    .controls-row { grid-template-columns: 1fr; }
  }
  
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-family: 'Outfit', sans-serif;
  }
  
  input, select {
    width: 100%;
    font-size: 14px;
    padding: 12px 16px;
    border: 1px solid var(--glass-border);
    background: rgba(0, 0, 0, 0.3);
    color: var(--text-main);
    border-radius: 8px;
    outline: none;
    transition: all 0.3s ease;
    font-family: 'Inter', sans-serif;
  }
  
  input:focus, select:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    background: rgba(0, 0, 0, 0.5);
  }
  
  select option { background: var(--bg-dark); }
  
  button {
    width: 100%;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    padding: 14px 24px;
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    transform: translateZ(30px);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  button:hover { 
    background: var(--accent-hover); 
    transform: translateZ(35px) translateY(-2px);
    box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
  }
  
  button:disabled { 
    opacity: 0.6; 
    cursor: not-allowed; 
    transform: translateZ(0); 
    box-shadow: none; 
  }
  
  .history-list {
    max-height: 400px;
    overflow-y: auto;
    margin-top: 16px;
    padding-right: 8px;
    transform: translateZ(10px);
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  .history-item {
    padding: 16px;
    border: 1px solid var(--glass-border);
    background: var(--card-bg);
    border-radius: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .history-item:hover { 
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(5px);
    border-color: rgba(255, 255, 255, 0.15);
  }
  
  .history-item-meta { display: flex; justify-content: space-between; margin-bottom: 6px; align-items: center; }
  .history-item-topic { font-weight: 600; color: #fff; font-size: 14px; }
  
  .badge {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    font-family: 'Outfit', sans-serif;
  }
  
  .badge.approved, .badge.pass { background: var(--success-bg); color: var(--success-text); border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge.rejected, .badge.fail { background: var(--error-bg); color: var(--error-text); border: 1px solid rgba(239, 68, 68, 0.3); }
  
  .audit-section-title {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    margin: 0 0 24px;
    color: #fff;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 12px;
    transform: translateZ(15px);
  }
  
  .attempt-card {
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    background: var(--card-bg);
    transform: translateZ(10px);
    transition: all 0.3s ease;
  }
  
  .attempt-card:hover {
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
  }

  .attempt-title {
    font-size: 15px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  
  .score-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  
  .score-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  
  .score-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.4);
  }

  .score-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-family: 'Outfit', sans-serif;}
  .score-val { 
    font-size: 24px; 
    font-weight: 800; 
    font-family: 'Outfit', sans-serif;
    color: #fff; 
    margin-top: 8px; 
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }
  
  .explanation, .notes-box, .mcq-item, .feedback-list {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.7;
    color: #e2e8f0;
  }
  
  .mcq-item { margin-bottom: 12px; }
  .mcq-q { font-weight: 600; margin-bottom: 12px; font-size: 15px; color: #fff; }
  .mcq-opts { padding-left: 24px; margin: 0; }
  .mcq-opts li { margin-bottom: 8px; }
  .mcq-opts li.correct { color: var(--success-text); font-weight: 600; text-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
  
  .tag-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .tag-item {
    background: rgba(59, 130, 246, 0.15);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.3);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    font-family: 'Outfit', sans-serif;
  }

  .feedback-list { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); }
  .feedback-item { color: #fca5a5; margin-bottom: 8px; }
  .feedback-item:last-child { margin-bottom: 0; }
  
  .empty { color: var(--text-muted); font-style: italic; text-align: center; padding: 40px; }
  
  .spin {
    display: inline-block; width: 16px; height: 16px; border: 2px solid var(--glass-border);
    border-top-color: #60a5fa; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 12px; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .errbox {
    background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 16px 20px; border-radius: 10px; font-size: 14px; margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }
</style>
<!-- Include Vanilla Tilt for 3D effect -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js" integrity="sha512-wC/cunGGDjXSl9OHsu09RuWd/Ea/bE/Hj3A+Uq87+8/U7j0K3BwN0UaX4lqWp/F/eC1+vXb6Z56f4dY1xL1i3Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div class="wrap">
  <h1>Governed & Auditable AI Content</h1>
  <div class="sub">Pipeline V2: Schema validation, 3D scoring, and bounded refinement.</div>

  <div class="layout">
    <div>
      <div class="glass-panel" data-tilt data-tilt-max="2" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.1">
        <div class="controls-row">
          <div>
            <label>User ID</label>
            <input id="userId" type="text" value="admin_user">
          </div>
          <div>
            <label>Grade</label>
            <select id="grade">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option selected>5</option><option>6</option>
              <option>7</option><option>8</option>
            </select>
          </div>
          <div>
            <label>Topic</label>
            <input id="topic" type="text" value="Fractions">
          </div>
        </div>
        <button id="run">Run Governed Pipeline</button>
      </div>

      <div id="error"></div>

      <div class="glass-panel">
        <div class="audit-section-title">Audit Trail & Output Lifecycle</div>
        <div id="audit-body"><div class="empty">System initialized. Awaiting parameters.</div></div>
      </div>
    </div>

    <div>
      <div class="glass-panel" data-tilt data-tilt-max="2" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.1">
        <label style="color: #fff; font-size: 16px;">Runs History</label>
        <button id="loadHistory" style="margin-top: 12px; padding: 10px 16px; font-size: 12px; background: rgba(255,255,255,0.1); box-shadow: none; border: 1px solid rgba(255,255,255,0.1);">Load History</button>
        <div class="history-list" id="history-list">
          <div style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 30px 0;">No history loaded.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const runBtn = document.getElementById('run');
const historyBtn = document.getElementById('loadHistory');

async function loadHistory() {
  const userId = document.getElementById('userId').value.trim();
  const listEl = document.getElementById('history-list');
  listEl.innerHTML = '<div class="empty"><span class="spin"></span>Syncing core databanks...</div>';
  try {
    const res = await fetch(`/history?user_id=${encodeURIComponent(userId)}`);
    const history = await res.json();
    if (!res.ok) throw new Error(history.detail || 'Failed to load history');
    if (!history.length) {
      listEl.innerHTML = '<div style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 30px 0;">No runs found for this user.</div>';
      return;
    }
    listEl.innerHTML = '';
    history.forEach(run => {
      const item = document.createElement('div');
      item.className = 'history-item';
      const statusClass = run.final.status === 'approved' ? 'approved' : 'rejected';
      const formattedTime = new Date(run.timestamps.started_at).toLocaleString();
      item.innerHTML = `
        <div class="history-item-meta">
          <span class="badge ${statusClass}">${run.final.status}</span>
          <span style="color: var(--text-muted); font-size: 11px; font-weight: 600;">G${run.input.grade}</span>
        </div>
        <div class="history-item-topic">${escapeHtml(run.input.topic)}</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">${formattedTime}</div>
      `;
      item.addEventListener('click', () => renderRunArtifact(run));
      listEl.appendChild(item);
    });
  } catch (err) {
    listEl.innerHTML = `<div style="font-size: 13px; color: var(--error-text); text-align: center; padding: 30px 0;">${escapeHtml(err.message)}</div>`;
  }
}

function renderRunArtifact(run) {
  const body = document.getElementById('audit-body');
  let html = `
    <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px;">
      <div>
        <div style="font-size: 12px; color: var(--text-muted); font-family: 'Outfit', sans-serif; letter-spacing: 0.05em;">RUN IDENTIFIER <br> <span style="color: #fff; font-size: 14px;">${run.run_id}</span></div>
        <div style="font-size: 18px; font-weight: 600; margin-top: 10px; color: #fff;">${escapeHtml(run.input.topic)} <span style="color: var(--text-muted); font-size: 14px;">(Grade ${run.input.grade})</span></div>
      </div>
      <div>
        <span class="badge ${run.final.status === 'approved' ? 'approved' : 'rejected'}" style="font-size: 14px; padding: 8px 16px; border-radius: 8px;">
          ${run.final.status.toUpperCase()}
        </span>
      </div>
    </div>
  `;

  html += `<div class="audit-section-title" style="font-size: 16px; margin-top: 32px;">Generation & Refinement Log</div>`;
  run.attempts.forEach(att => {
    const isPass = att.review.pass;
    html += `
      <div class="attempt-card">
        <div class="attempt-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Attempt 0${att.attempt}</span>
          <span class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'FAIL'}</span>
        </div>
        
        <div class="score-grid">
          <div class="score-box">
            <div class="score-label">Age Appr.</div>
            <div class="score-val">${att.review.scores.age_appropriateness}/5</div>
          </div>
          <div class="score-box">
            <div class="score-label">Correctness</div>
            <div class="score-val">${att.review.scores.correctness}/5</div>
          </div>
          <div class="score-box">
            <div class="score-label">Clarity</div>
            <div class="score-val">${att.review.scores.clarity}/5</div>
          </div>
          <div class="score-box">
            <div class="score-label">Coverage</div>
            <div class="score-val">${att.review.scores.coverage}/5</div>
          </div>
        </div>

        <div style="font-weight: 600; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Generated Draft Content</div>
        <div class="explanation">
          <strong style="color: #fff;">Explanation (Grade ${att.draft.explanation.grade}):</strong><br><br>
          ${escapeHtml(att.draft.explanation.text)}
        </div>

        <div class="mcq-list">
          ${att.draft.mcqs.map((q, idx) => `
            <div class="mcq-item">
              <div class="mcq-q">Q${idx+1}. ${escapeHtml(q.question)}</div>
              <ol class="mcq-opts" type="A">
                ${q.options.map((opt, oIdx) => `
                  <li class="${oIdx === q.correct_index ? 'correct' : ''}">
                    ${escapeHtml(opt)} ${oIdx === q.correct_index ? '✓' : ''}
                  </li>
                `).join('')}
              </ol>
            </div>
          `).join('')}
        </div>

        <div class="notes-box">
          <strong style="color: #fff;">Learning Objective:</strong> ${escapeHtml(att.draft.teacher_notes.learning_objective)}<br><br>
          <strong style="color: #fff;">Common Misconceptions:</strong>
          <ul style="margin: 8px 0 0; padding-left: 20px;">
            ${att.draft.teacher_notes.common_misconceptions.map(m => `<li>${escapeHtml(m)}</li>`).join('')}
          </ul>
        </div>
    `;

    if (!isPass && att.review.feedback && att.review.feedback.length) {
      html += `
        <div class="feedback-list">
          <strong style="color: #fca5a5; display: block; margin-bottom: 12px; font-family: 'Outfit', sans-serif;">REVIEWER CRITIQUE & FEEDBACK:</strong>
          ${att.review.feedback.map(fb => `
            <div class="feedback-item">
              <strong style="color: #fff;">[${escapeHtml(fb.field)}]</strong> - ${escapeHtml(fb.issue)}
            </div>
          `).join('')}
        </div>
      `;
    }

    if (att.refined) {
      html += `
        <div style="margin-top: 20px; padding: 16px; background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; border-radius: 0 8px 8px 0; font-size: 13px; color: #93c5fd;">
          <strong style="color: #fff;">Refiner Agent Triggered:</strong> Generated refined draft addressing feedback items dynamically.
        </div>
      `;
    }

    html += `</div>`;
  });

  if (run.final.status === 'approved' && run.final.tags) {
    const t = run.final.tags;
    html += `
      <div class="attempt-card" style="background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2);">
        <div class="attempt-title" style="color: #34d399;">Final Classification Tags</div>
        <div class="tag-container">
          <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Subject: ${escapeHtml(t.subject)}</div>
          <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Topic: ${escapeHtml(t.topic)}</div>
          <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Grade: ${escapeHtml(String(t.grade))}</div>
          <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Difficulty: ${escapeHtml(t.difficulty)}</div>
          <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Bloom's Level: ${escapeHtml(t.blooms_level)}</div>
          ${t.content_type.map(ct => `
            <div class="tag-item" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">Type: ${escapeHtml(ct)}</div>
          `).join('')}
        </div>
      </div>
    `;
  }

  const start = new Date(run.timestamps.started_at);
  const end = new Date(run.timestamps.finished_at);
  const duration = ((end - start) / 1000).toFixed(1);
  html += `
    <div style="font-size: 12px; color: var(--text-muted); margin-top: 24px; border-top: 1px solid var(--glass-border); padding-top: 16px; display: flex; justify-content: space-between;">
      <span>Started: ${start.toLocaleString()}</span>
      <span>Execution Time: <strong style="color: #fff;">${duration}s</strong></span>
    </div>
  `;

  body.innerHTML = html;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

runBtn.addEventListener('click', async () => {
  const userId = document.getElementById('userId').value.trim();
  const grade = document.getElementById('grade').value;
  const topic = document.getElementById('topic').value.trim();
  const errorEl = document.getElementById('error');
  const auditEl = document.getElementById('audit-body');

  errorEl.innerHTML = '';
  if (!topic) {
    errorEl.innerHTML = `<div class="errbox">Please enter a valid topic.</div>`;
    return;
  }

  runBtn.disabled = true;
  runBtn.innerHTML = `<span class="spin"></span> Processing Matrix...`;
  auditEl.innerHTML = `
    <div class="empty" style="padding: 60px 20px;">
      <span class="spin" style="width: 24px; height: 24px; border-width: 3px;"></span>
      <div style="margin-top: 16px; font-size: 15px; color: #fff;">Executing Neural Pipeline</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">Generating content, running quality evaluations, and iterating refinements...</div>
    </div>
  `;

  try {
    const res = await fetch('/api/run-pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ grade: Number(grade), topic, user_id: userId })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.detail || 'Pipeline request failed');
    renderRunArtifact(result);
    loadHistory(); 
  } catch (err) {
    errorEl.innerHTML = `<div class="errbox"><strong>CRITICAL ERROR:</strong> ${escapeHtml(err.message)}</div>`;
    auditEl.innerHTML = `<div class="empty" style="color: var(--error-text);">Execution halted due to anomalies.</div>`;
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = `Run Governed Pipeline`;
  }
});

historyBtn.addEventListener('click', loadHistory);

loadHistory();
</script>
</body>
</html>
